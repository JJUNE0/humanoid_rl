# Frame-aligned ADD comparison against the same episode_00002/fixed mjlab scene.
# Keep the preceding AMP experiment's native robot, action scales, fall rule and
# auxiliary control costs. Required additions: reference phase and clip-end done.
# This is ADD + FlashSAC, not a reproduction of the paper's full PPO experiment.
data_root: /home/cocel/Desktop/Research/humanoid/I-BFM-Code/ibfm/tasks/carry_box/rollouts/carry_20_40_success500_v1
single_motion: episode_00002/motion.npz
fixed_initial_state: true
observe_object: true
hidden_dims: [512, 256]
learning_rate: 0.00001
batch_size: 512
gradient_penalty: 10.0
weight_decay: 0.0001
logit_regularization: 0.05
reward_scale: 1.0
min_feature_std: 0.1
reference_init_probability: 0.0
validation_every: 100
cache_dir: outputs/amp_cache
terminate_on_fall: false
terminate_on_success: true
action_scale_multiplier: 5.0
control:
  action_rate: -0.1
  feet_orientation: -0.4
  ankle_roll: -4.0
  joint_position_limit: -10.0
  slippage: -4.0
  undesired_contact: -1.0
  action_rate_scale: 5.0
  actor_weight: 0.02
  ema_decay: 0.99
